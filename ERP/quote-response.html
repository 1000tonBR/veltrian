  <style>*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#102d3a;font-family:Arial,sans-serif}.top{padding:24px max(20px,calc((100vw - 980px)/2));background:#071724;color:#fff}.brand{color:#31d8ce;font-weight:800;letter-spacing:3px;font-size:20px}.top p{margin:7px 0 0;color:#abc0c6;font-size:12px;letter-spacing:1.5px}.wrap{max-width:980px;margin:28px auto;padding:0 18px}.card{padding:clamp(22px,4vw,38px);border:1px solid #d8e5e6;border-radius:18px;background:#fff;box-shadow:0 18px 55px rgba(7,23,36,.08)}.kicker{margin:0 0 7px;color:#087d83;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{margin:0;font-size:clamp(25px,4vw,38px)}.lead{margin:12px 0 25px;color:#60777c;line-height:1.6}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}.summary span{padding:14px;border-radius:10px;background:#edf8f7;color:#60777c;font-size:12px}.summary strong{display:block;margin-top:5px;color:#102d3a;font-size:14px}.table{overflow:auto;margin-bottom:24px;border:1px solid #d8e5e6;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:13px 15px;border-bottom:1px solid #e1ebec;text-align:left;font-size:13px}th{background:#f4f8f8;color:#60777c;font-size:11px;letter-spacing:1px}td span{display:block;margin-top:4px;color:#60777c}tr:last-child td{border-bottom:0}.info,.warning{display:grid;gap:5px;margin:0 0 20px;padding:14px 16px;border-radius:10px;background:#e7f7f5;color:#176b68;font-size:13px}.warning{background:#fff2dd;color:#8b5b14}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;color:#38565e;font-size:13px;font-weight:700}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #bccfd1;border-radius:8px;background:#fff;color:#102d3a;font:inherit}input:focus,select:focus,textarea:focus{outline:3px solid rgba(13,143,140,.16);border-color:#0d8f8c}textarea{min-height:105px;resize:vertical}.total{padding:15px;border-radius:9px;background:#e9f7f5;color:#0d5e61;font-size:18px;font-weight:800}.form-error{margin:18px 0 0;padding:12px 14px;border-radius:9px;background:#fde6e6;color:#9b2828;font-size:13px}.actions{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:24px}.actions small{max-width:520px;color:#75898e;line-height:1.5}.submit{flex:none;padding:14px 22px;border:0;border-radius:9px;background:#087d83;color:#fff;font-weight:800;cursor:pointer}.submit:hover{background:#066b70}.submit:disabled{opacity:.65;cursor:wait}.state{display:grid;place-items:center;min-height:360px;text-align:center}.state-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:50%;background:#dcf7ed;color:#167454;font-size:28px}.state.error .state-icon{background:#fde6e6;color:#9b2828}.state p{max-width:560px;color:#60777c;line-height:1.6}@media(max-width:680px){.summary,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{align-items:stretch;flex-direction:column}.submit{width:100%}}</style>
